expose:
  type: ingress
  tls:
    enabled: true
    certSource: secret
    secret:
      secretName: "harbor-tls"
  ingress:
    hosts:
      core: harbor.local
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: selfsigned-issuer

externalURL: https://harbor.local:8443

harborAdminPassword: "Harbor12345"

persistence:
  enabled: true
  resourcePolicy: "keep"
  persistentVolumeClaim:
    registry:
      size: 5Gi
    database:
      size: 2Gi
    redis:
      size: 1Gi
    trivy:
      size: 2Gi
    jobservice:
      jobLog:
        size: 1Gi

trivy:
  enabled: true

metrics:
  enabled: false